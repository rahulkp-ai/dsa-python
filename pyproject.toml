[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "dsa-python"
version = "1.0.0"
description = "World-class Data Structures & Algorithms in Python"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "DSA-Python Contributors"}]
keywords = ["dsa", "algorithms", "data-structures", "python", "interview-prep"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Education",
]
dependencies = ["numpy>=1.25.0", "matplotlib>=3.7.2", "rich>=13.5.0", "typer>=0.9.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4.0","pytest-cov>=4.1.0","black>=23.7.0","flake8>=6.1.0","mypy>=1.5.0"]
notebooks = ["jupyter>=1.0.0","ipykernel>=6.25.0"]
viz = ["networkx>=3.1","seaborn>=0.12.2"]

[project.scripts]
dsa = "src.cli.main:app"

[tool.black]
line-length = 88
target-version = ["py39","py310","py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.9"
warn_return_any = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*","benchmarks/*","*/__init__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
